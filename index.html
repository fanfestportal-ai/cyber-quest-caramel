<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кибер-квест «Проект: Карамель» — выбор отдела</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0f0a; color: #00ff00;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 20px;
  }
  h1 { font-size: 2.4em; text-shadow: 0 0 20px #00ff00; text-align: center; margin-bottom: 10px; }
  p.sub { color: #8f8; margin-bottom: 40px; text-align: center; }
  .cards { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
  a.card {
    display: block; width: 300px; padding: 30px 20px;
    border: 2px solid #00ff00; border-radius: 10px;
    background: #0f1a0f; color: #00ff00; text-decoration: none;
    text-align: center; transition: .2s; box-shadow: 0 0 20px #00ff00;
  }
  a.card:hover { background: #00ff00; color: #0a0f0a; }
  a.card .icon { font-size: 3em; display: block; margin-bottom: 15px; }
  a.card h2 { font-size: 1.4em; margin-bottom: 10px; }
  a.card span { font-size: .9em; opacity: .8; }
  footer { margin-top: 50px; color: #555; font-size: .8em; }
</style>
</head>
<body>
  <h1>🚨 ПРОЕКТ: КАРАМЕЛЬ 🚨</h1>
  <p class="sub">Выберите отдел для начала работы</p>
  <div class="cards">
    <a class="card" href="police.html">
      <span class="icon">🚔</span>
      <h2>ПОЛИЦИЯ</h2>
      <span>Отдел 1 — 5 агентов</span>
    </a>
    <a class="card" href="fbi.html">
      <span class="icon">🕵️</span>
      <h2>ФБР</h2>
      <span>Отдел 2 — 4 агента</span>
    </a>
    <a class="card" href="cyber.html">
      <span class="icon">💻</span>
      <h2>КИБЕРБЕЗОПАСНОСТЬ</h2>
      <span>Отдел 3 — 4 агента</span>
    </a>
  </div>
  <footer>Прогресс сохраняется в браузере. Проходите квест в одном и том же браузере.</footer>
</body>
</html>
