<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФБР | КИБЕР-КВЕСТ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-fbi">
    <div class="top-bar">
        <div class="logo">🕵️ <span>ФБР</span></div>
        <div class="timer" id="timer">02:00:00</div>
        <button class="dossier-btn" onclick="toggleDossier()">🔍 ДОСЬЕ</button>
    </div>

    <div class="modal" id="dossierModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleDossier()">×</button>
            <h2 style="margin-top:0; font-size:1.6rem;">БАЗА ДАННЫХ ПОДОЗРЕВАЕМЫХ</h2>
            <ul class="dossier-list" id="dossierList"></ul>
        </div>
    </div>

    <div class="quest-container" id="questContainer"></div>

    <script>
        const dossierData = [
            // ВАЖНЫЕ
            { name: "Дана Сергеевна (Шеф)", img: "fingerprints/i%20(11).webp", text: "Руководитель отдела. Знает всё обо всех. Нет подтверждённого алиби — была на совещании, но никто не видел. На флешке найден её отпечаток. Мотив: приготовить карамель для детей." },
            { name: "Шаврюкова Яна Александровна", img: "fingerprints/i%20(10).webp", text: "Увлекается историей и архивами. Восстановила историю школьного проекта. Алиби: искала в архиве, но архив был закрыт." },
            { name: "Глебова Виктория Сергеевна", img: "fingerprints/i%20(9).webp", text: "Специалист по восстановлению удалённых файлов. В день инцидента была у медсестры, что не соответствует алиби. Навыки позволяют скрыть следы доступа." },

            // ОСТАЛЬНЫЕ
            { name: "Багров Дмитрий Иванович", img: "fingerprints/istockphoto-1721066484-612x612.jpg", text: "Начинал как сисадмин школьного кабинета. Разрабатывал скрипты для автоматизации домашки. Завербован за нестандартное мышление. Алиби: был в столовой, но время не подтверждено." },
            { name: "Батенева Милана Сергеевна", img: "fingerprints/c07d45606c04ef8a28a1d91d86721e23.png", text: "Победитель олимпиад по математике. Решает сложные логические задачи. Решала задачи в кабинете одна. Алиби: кабинет, одна." },
            { name: "Бутырин Степан Ильич", img: "fingerprints/2604556.png", text: "Увлекается криптографией и старинными шифрами. Помог раскрыть серию взломов. Алиби: гулял в рекреации, но камеры зафиксировали в другом крыле." },
            { name: "Дробинина Анна Дмитриевна", img: "fingerprints/fingerprint-black-white_1136343-26958.avif", text: "Автор программы для выявления лжи. Алиби о столовой опровергается камерами. Часто отлучается на переменах." },
            { name: "Зайков Тимофей Денисович", img: "fingerprints/8d6066706809cf78221b45a0f0288692.png", text: "Мастер спорта по киберспорту. Ранее взломал школьную сеть ради шутки. Утверждает, что играл в телефоне, но активность в сети требует проверки." },
            { name: "Кордюкова Анастасия Евгеньевна", img: "fingerprints/istockphoto-165083431-612x612.jpg", text: "Специалист по социальной инженерии. Выведывает пароли через доверительные беседы. Алиби: болтала с другом, но личность друга не установлена." },
            { name: "Пильникова Александра Владимировна", img: "fingerprints/istockphoto-2227045613-612x612.jpg", text: "Разбирается в аппаратном обеспечении. Починила сервер учителя. Алиби: чинила принтер, но журнал событий не содержит записей о неисправностях." },
            
            // ДУБЛИ
            { name: "Соколова Мария Васильевна", img: "fingerprints/istockphoto-1721066484-612x612.jpg", text: "Увлекается рисованием и визуальными ребусами. Помогла раскрыть подделку документов. Алиби: рисовала на доске, но следов работы нет." },
            { name: "Татаринова Вера Вячеславовна", img: "fingerprints/c07d45606c04ef8a28a1d91d86721e23.png", text: "Эксперт по нейросетям. Создала ИИ-помощника для библиотеки. Алиби: генерировала картинки, но история запросов очищена." },
            
            { name: "Ценев Илья Алексеевич", img: "fingerprints/i%20(8).webp", text: "Бывший геймер, знает все читы. Предотвратил кибератаку на школу. Алиби: проверял антивирус, но логи показывают, что он не запускался." }
        ];

        const list = document.getElementById('dossierList');
        dossierData.forEach(item => {
            const li = document.createElement('li');
            li.className = 'dossier-item';
            li.innerHTML = `
                <div style="display:flex; align-items:center; margin-bottom:10px;">
                    <img src="${item.img}" alt="Отпечаток" style="width:60px; height:60px; object-fit:contain; background:#fff; border-radius:8px; margin-right:15px; padding:5px; border:1px solid var(--border-color);">
                    <span class="dossier-name" style="margin-bottom:0;">${item.name}</span>
                </div>
                <span class="dossier-text">${item.text}</span>
            `;
            list.appendChild(li);
        });

        function toggleDossier() { document.getElementById('dossierModal').classList.toggle('active'); }

        let timeLeft = 7200;
        if (localStorage.getItem('fbi_timer_v2')) timeLeft = parseInt(localStorage.getItem('fbi_timer_v2'));
        function updateTimer() {
            if (timeLeft <= 0) { document.getElementById('timer').innerText = '00:00:00'; return; }
            let h = Math.floor(timeLeft / 3600), m = Math.floor((timeLeft % 3600) / 60), s = timeLeft % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            timeLeft--; localStorage.setItem('fbi_timer_v2', timeLeft);
        }
        setInterval(updateTimer, 1000); updateTimer();

        const stages = [
            { title:"ЭТАП 1: АЗБУКА МОРЗЕ",
              desc:"Перехвачен радиосигнал. Расшифруйте последовательность (ответ — русское слово):<br><br><strong style='font-size:1.5rem;color:var(--accent);'>«-... .-.. .. --.. -.- .. .---»</strong>",
              info:"Азбука Морзе: буквы — точки и тире. Воспользуйтесь онлайн-таблицей.", answer:"близкий", hint:"Найдите таблицу Морзе и расшифруйте по буквам.", type:"text" },
            { title:"ЭТАП 2: ПЕРЕКРЁСТНЫЙ КОД",
              desc:"Свяжитесь с отделом Полиции. Они получили код для доступа к части файла. Введите его:",
              info:"Код состоит из названия отдела и года.", answer:"fbi-2026", hint:"FBI-2026", type:"text" },
            { title:"ЭТАП 3: БИОМЕТРИЧЕСКАЯ ЗАЩИТА",
              desc:"Система требует голосового подтверждения от начальника отдела. Подтвердите личность — прикрепите аудиофайл с голосовым подтверждением.",
              info:"Подумайте, как получить голос начальника, не имея его записи. Подойдёт любой файл-подтверждение.", answer:"file", hint:"Используйте инструмент синтеза речи.", type:"file", accept:"audio/*" },
            { title:"ЭТАП 4: ПОИСК УЛИКИ",
              desc:"Система выдала координаты: «Ищите там, где растут цветы». Найдите в кабинете записку и введите код с неё:",
              info:"Посмотрите на окна.", answer:"невашотдел", hint:"Проверьте цветочные горшки на подоконнике.", type:"text" },
            { title:"ЭТАП 5: ДВОИЧНЫЙ КОД",
              desc:"Переведите двоичный код в текст:<br><div class='terminal'>01110000 01110010 01100101 01110011 01110100 01110101 01110000 01101110 01101001 01101011 01110011 01101111 01110110 01110011 01100101 01101101 01100010 01101100 01101001 01111010 01101011 01101111</div>",
              info:"Онлайн-конвертер binary to text.", answer:"преступниксовсемблизко", hint:"Преступник совсем близко.", type:"text" },
            { title:"ЭТАП 6: РАСШИФРОВКА ХЕША",
              desc:"Хеш пароля: <span class='terminal' style='display:inline-block;padding:6px 10px;'>21232f297a57a5a743894a0e4a801fc3</span><br>Найдите в интернете, что это за пароль:",
              info:"Один из самых популярных паролей-логинов.", answer:"admin", hint:"Admin", type:"text" },
            { title:"ЭТАП 7: АНАЛИЗ ДОСЬЕ",
              desc:"Изучите досье. У скольких человек ЕСТЬ подтверждённое алиби? Введите число:",
              info:"Совещание — не алиби, если никто не видел. Считайте внимательно.", answer:"0", hint:"Ни у кого нет подтверждённого алиби.", type:"text" },
            { title:"ЭТАП 8: ЭКСПЕРТИЗА",
              desc:"Найдите в интернете, что такое «баллистическая экспертиза», и введите ключевое слово (единственное число):<br><br><em>Важно: обратите внимание на основной экран кабинета.</em>",
              info:"Это наука о движении снарядов.", answer:"пуля", hint:"Пуля", type:"text" },
            { title:"ЭТАП 9: QR-КОД",
              desc:"На белой доске висит QR-код. Отсканируйте его и введите секретное слово:",
              info:"Используйте телефон или онлайн-сканер.", answer:"преступница", hint:"Преступница", type:"text" },
            { title:"ЭТАП 10: ЛОГИКА",
              desc:"Если X < Y, Y < Z, а Z < W, то кто самый большой?",
              info:"Простая логика.", answer:"w", hint:"W", type:"text" },
            { title:"ЭТАП 11: МАТЕМАТИКА",
              desc:"Сколько будет 20% от 150?",
              info:"20% — это 20/100.", answer:"30", hint:"Тридцать", type:"text" },
            { title:"ЭТАП 12: ШИФР АТБАШ",
              desc:"Расшифруйте слово (шифр Атбаш): <strong style='font-size:1.4rem;color:var(--accent);'>ФМРПОЪНМЛПСЦФ</strong>",
              info:"Атбаш — зеркальный алфавит (А=Я, Б=Ю).", answer:"ктопреступник", hint:"Кто преступник", type:"text" },
            { title:"ЭТАП 13: ГЕОГРАФИЯ",
              desc:"В каком году был основан город Москва?",
              info:"Это было при Юрии Долгоруком.", answer:"1147", hint:"1147", type:"text" },
            { title:"ЭТАП 14: ИСТОРИЯ",
              desc:"В каком году распался СССР?",
              info:"Это произошло в декабре.", answer:"1991", hint:"1991", type:"text" },
            { title:"ЭТАП 15: ВНИМАНИЕ",
              desc:"Сколько раз буква «А» встречается в слове «БАРАБАН»?",
              info:"Просто посчитайте.", answer:"3", hint:"Три", type:"text" },
            { title:"ЭТАП 16: ЛОГИКА",
              desc:"У матери 4 дочери. У каждой есть брат. Сколько всего детей?",
              info:"Брат один на всех.", answer:"5", hint:"Пять", type:"text" },
            { title:"ЭТАП 17: ПОИСК УЛИК",
              desc:"Ищите под оранжевой партой папку с надписью «СЕКРЕТНО». Введите код с папки:",
              info:"Код написан маркером.", answer:"оченьважныезаписишефа", hint:"Очень важные записи шефа", type:"text" },
            { title:"ЭТАП 18: АНАЛИЗ",
              desc:"Сравните отпечаток на флешке (она внизу) с базой данных. Чей это отпечаток? Введите имя:",
              info:"У кого нет алиби?", answer:"яна", hint:"Яна", type:"text" },
            { title:"ЭТАП 19: СБОРКА ПАЗЛА",
              desc:"<div class='big-puzzle'>ОДНА ЧАСТЬ ПАЗЛА ПОЛУЧЕНА.<br>ВЗЛОМ ОПРАВДАН.<br>ЭТО ПОНАДОБИТСЯ ПОЗЖЕ.</div><br>Ваш фрагмент двоичного кода:<div class='terminal' style='color:#fff;font-size:1.05rem;'>00101100 00100000 00110001 00110000 00110000 00100000 01100111 00100000 01101101 01100001 01110011 01101100 01100001 00101100 00100000 00110010 00100000 01110011 01110100 00101110 00100000 01101100 00101110 00100000 01110110 01101111 01100100 01111001</div>",
              info:"Сохраните этот код. Он понадобится в финале. Введите «!!!», чтобы продолжить.", answer:"!!!", hint:"Введите три восклицательных знака: !!!", type:"text" },
            { title:"ЭТАП 20: ФИНАЛ",
              desc:"Вы собрали все улики. Кто преступник?",
              info:"Проверьте алиби ещё раз.", answer:"дана сергеевна", hint:"Дана Сергеевна", type:"text" }
        ];

        let state = { currentStage: 0, attempts: 0, notes: "" };
        if (localStorage.getItem('fbi_state_v2')) state = JSON.parse(localStorage.getItem('fbi_state_v2'));
        function saveState() { localStorage.setItem('fbi_state_v2', JSON.stringify(state)); }

        const container = document.getElementById('questContainer');

        function renderStage() {
            if (state.currentStage >= stages.length) {
                container.innerHTML = `<div class="final-block"><h2>🎉 ДЕЛО ЗАКРЫТО!</h2><p style="font-size:1.2rem;color:#fff;">Преступник — <strong>Дана Сергеевна</strong>. Мотив: приготовить карамель для детей. Заберите рецепт и Chupa Chups!</p></div>`;
                return;
            }
            const s = stages[state.currentStage];
            let inputHtml = '';
            if (s.type === 'file') {
                inputHtml = `<input type="file" id="fileInput" accept="${s.accept||''}"><button class="btn" onclick="checkAnswer()">ОТПРАВИТЬ</button>`;
            } else {
                inputHtml = `<input type="text" id="textInput" placeholder="Введите ответ"><button class="btn" onclick="checkAnswer()">ПРОВЕРИТЬ</button>`;
            }
            container.innerHTML = `
                <div class="progress-bar">ЭТАП ${state.currentStage + 1} ИЗ ${stages.length}</div>
                <div class="stage">
                    <h2>${s.title}</h2>
                    <p>${s.desc}</p>
                    <div class="info-block"><strong>Сведения от шефа:</strong> ${s.info}</div>
                    ${inputHtml}
                    <p class="msg" id="errorMsg"></p>
                    <p class="hint" id="hintMsg"></p>
                    <div id="passBlock" class="hidden" style="margin-top:20px;border-top:1px solid var(--border-color);padding-top:20px;">
                        <p style="color:#ffbb33;font-size:0.9rem;">Требуется пароль от шефа (родительский контроль):</p>
                        <input type="password" id="passInput" placeholder="Пароль шефа">
                        <button class="btn btn-warning" onclick="checkPass()">ВВЕСТИ ПАРОЛЬ</button>
                        <p class="msg" id="passMsg"></p>
                        <div id="answerBlock" class="hidden" style="margin-top:15px;">
                            <p style="color:#00ff00;font-weight:bold;">Правильный ответ: ${s.answer === '__number__' ? 'любое число' : s.answer}</p>
                            <button class="btn" onclick="nextStage()">ПРОДОЛЖИТЬ</button>
                        </div>
                    </div>
                    <div style="margin-top:25px;border-top:1px solid var(--border-color);padding-top:15px;">
                        <strong style="color:var(--accent);font-size:0.95rem;">📝 Лист заметок</strong>
                        <textarea class="notes-area" id="notesArea" placeholder="Записывайте, про кого какая информация уже есть...">${state.notes||''}</textarea>
                        <button class="btn" style="padding:10px 20px;font-size:0.9rem;margin-top:8px;" onclick="saveNotes()">СОХРАНИТЬ ЗАМЕТКИ</button>
                    </div>
                </div>`;
            if (state.attempts >= 10) {
                document.getElementById('passBlock').classList.remove('hidden');
                document.getElementById('errorMsg').innerText = "Лимит попыток исчерпан.";
            } else if (state.attempts >= 6) {
                document.getElementById('hintMsg').innerText = "Подсказка: " + s.hint;
            }
        }

        function saveNotes() {
            const el = document.getElementById('notesArea');
            if (el) { state.notes = el.value; saveState(); }
        }

        function checkAnswer() {
            const s = stages[state.currentStage];
            let val = '';
            if (s.type === 'file') {
                const f = document.getElementById('fileInput');
                if (f.files.length > 0) val = 'file';
            } else {
                const el = document.getElementById('textInput');
                val = (el.value || '').trim().toLowerCase().replace(/\s+/g,' ');
            }
            let ok = false;
            if (s.answer === '__number__') {
                ok = val.length > 0 && !isNaN(val);
            } else if (s.type === 'file') {
                ok = (s.answer === 'file' && val === 'file');
            } else {
                ok = (val === s.answer.toLowerCase());
            }
            if (ok) {
                saveNotes();
                nextStage();
            } else {
                state.attempts++; saveState();
                const errorMsg = document.getElementById('errorMsg');
                const hintMsg = document.getElementById('hintMsg');
                const passBlock = document.getElementById('passBlock');
                if (state.attempts >= 10) {
                    errorMsg.innerText = "Лимит попыток исчерпан.";
                    passBlock.classList.remove('hidden');
                } else if (state.attempts >= 6) {
                    errorMsg.innerText = "Неверно.";
                    hintMsg.innerText = "Подсказка: " + s.hint;
                } else {
                    errorMsg.innerText = "Неверно! Попробуйте ещё раз.";
                }
            }
        }

        function checkPass() {
            const pass = document.getElementById('passInput').value.trim();
            if (pass === '1357') {
                document.getElementById('passMsg').innerText = "";
                document.getElementById('answerBlock').classList.remove('hidden');
                document.getElementById('passBlock').classList.add('hidden');
            } else {
                document.getElementById('passMsg').innerText = "Доступ запрещён. Неверный пароль.";
            }
        }

        function nextStage() {
            state.currentStage++;
            state.attempts = 0;
            saveState();
            renderStage();
        }

        renderStage();
    </script>
</body>
</html>
