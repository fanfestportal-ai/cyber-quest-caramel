<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПОЛИЦИЯ | КИБЕР-КВЕСТ</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .progress-bar { font-family:'Share Tech Mono',monospace; color:var(--accent); font-size:0.95rem; margin-bottom:10px; letter-spacing:1px; }
        .notes-area { width:100%; box-sizing:border-box; min-height:90px; background:rgba(0,0,0,0.4); border:1px solid var(--border-color); color:#fff; border-radius:12px; padding:12px; font-family:'Inter',sans-serif; font-size:0.95rem; margin-top:10px; }
        .dossier-photo { width:48px; height:48px; border-radius:50%; background:var(--accent-glow); display:inline-flex; align-items:center; justify-content:center; font-size:1.4rem; margin-right:12px; vertical-align:middle; }
        .big-puzzle { font-size:1.5rem; color:#ffaa00; font-weight:700; line-height:1.4; letter-spacing:1px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">🚔 <span>ПОЛИЦИЯ</span></div>
        <div class="timer" id="timer">02:00:00</div>
        <button class="dossier-btn" onclick="toggleDossier()">🔍 ДОСЬЕ</button>
    </div>

    <div class="modal" id="dossierModal">
        <div class="modal-content">
            <button class="close-btn" onclick="toggleDossier()">×</button>
            <h2 style="margin-top:0; font-size:1.6rem;">БАЗА ДАННЫХ ПОДОЗРЕВАЕМЫХ</h2>
            <ul class="dossier-list" id="dossierList"></ul>
        </div>
    </div>

    <div class="quest-container" id="questContainer"></div>

    <script>
        // ===== ДОСЬЕ (фото-заглушки; замените emoji на <img src="..."> при наличии фото) =====
        const dossierData = [
            { name: "Багров Дмитрий Иванович", emoji: "🧑‍💻", text: "Начинал как сисадмин школьного кабинета. Разрабатывал скрипты для автоматизации домашки. Завербован за нестандартное мышление. Алиби: был в столовой, но время не подтверждено." },
            { name: "Батенева Милана Сергеевна", emoji: "👩‍🎓", text: "Победитель олимпиад по математике. Решает сложные логические задачи. Решала задачи в кабинете одна. Алиби: кабинет, одна." },
            { name: "Бутырин Степан Ильич", emoji: "🧑‍🔬", text: "Увлекается криптографией и старинными шифрами. Помог раскрыть серию взломов. Алиби: гулял в рекреации, но камеры зафиксировали в другом крыле." },
            { name: "Глебова Виктория Сергеевна", emoji: "👩‍💼", text: "Специалист по восстановлению удалённых файлов. В день инцидента была у медсестры, что не соответствует алиби. Навыки позволяют скрыть следы доступа." },
            { name: "Дробинина Анна Дмитриевна", emoji: "👩‍🏫", text: "Автор программы для выявления лжи. Алиби о столовой опровергается камерами. Часто отлучается на переменах." },
            { name: "Зайков Тимофей Денисович", emoji: "🧑‍🎮", text: "Мастер спорта по киберспорту. Ранее взломал школьную сеть ради шутки. Утверждает, что играл в телефоне, но активность в сети требует проверки." },
            { name: "Кордюкова Анастасия Евгеньевна", emoji: "👩‍💻", text: "Специалист по социальной инженерии. Выведывает пароли через доверительные беседы. Алиби: болтала с другом, но личность друга не установлена." },
            { name: "Пильникова Александра Владимировна", emoji: "👩‍🔧", text: "Разбирается в аппаратном обеспечении. Починила сервер учителя. Алиби: чинила принтер, но журнал событий не содержит записей о неисправностях." },
            { name: "Соколова Мария Васильевна", emoji: "👩‍🎨", text: "Увлекается рисованием и визуальными ребусами. Помогла раскрыть подделку документов. Алиби: рисовала на доске, но следов работы нет." },
            { name: "Татаринова Вера Вячеславовна", emoji: "🤖", text: "Эксперт по нейросетям. Создала ИИ-помощника для библиотеки. Алиби: генерировала картинки, но история запросов очищена." },
            { name: "Ценев Илья Алексеевич", emoji: "🧑‍💻", text: "Бывший геймер, знает все читы. Предотвратил кибератаку на школу. Алиби: проверял антивирус, но логи показывают, что он не запускался." },
            { name: "Шаврюкова Яна Александровна", emoji: "👩‍📚", text: "Увлекается историей и архивами. Восстановила историю школьного проекта. Алиби: искала в архиве, но архив был закрыт." },
            { name: "Дана Сергеевна (Шеф)", emoji: "🕵️‍♀️", text: "Руководитель отдела. Знает всё обо всех. Нет подтверждённого алиби — была на совещании, но никто не видел. На флешке найден её отпечаток. Мотив: приготовить карамель для детей." }
        ];
        const list = document.getElementById('dossierList');
        dossierData.forEach(item => {
            const li = document.createElement('li');
            li.className = 'dossier-item';
            li.innerHTML = `<span class="dossier-photo">${item.emoji}</span><span class="dossier-name">${item.name}</span><span class="dossier-text">${item.text}</span>`;
            list.appendChild(li);
        });
        function toggleDossier() { document.getElementById('dossierModal').classList.toggle('active'); }

        // ===== ТАЙМЕР (2:00:00) =====
        let timeLeft = 7200;
        if (localStorage.getItem('police_timer_v2')) timeLeft = parseInt(localStorage.getItem('police_timer_v2'));
        function updateTimer() {
            if (timeLeft <= 0) { document.getElementById('timer').innerText = '00:00:00'; return; }
            let h = Math.floor(timeLeft / 3600), m = Math.floor((timeLeft % 3600) / 60), s = timeLeft % 60;
            document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            timeLeft--; localStorage.setItem('police_timer_v2', timeLeft);
        }
        setInterval(updateTimer, 1000); updateTimer();

        // ===== 20 ЭТАПОВ =====
        const stages = [
            { title:"ЭТАП 1: ШИФР ЦЕЗАРЯ",
              desc:"Этот текст зашифрован шифром Цезаря со сдвигом на 2 буквы вперёд. Расшифруйте его (введите слитно без пробелов):<br><br><strong style='font-size:1.5rem;color:var(--accent);'>«ЩЙЦТ ЩЖЙВТВ»</strong>",
              info:"Шифр Цезаря — сдвиг букв по алфавиту. При сдвиге вперёд на 1: А→Б, Б→В. Чтобы расшифровать — сдвигаем назад.",
              answer:"шифрцезаря", hint:"Сдвиньте каждую букву на 2 позиции НАЗАД (Щ→Ш, Й→И…).", type:"text" },
            { title:"ЭТАП 2: ПЕРЕКРЁСТНЫЙ КОД",
              desc:"Свяжитесь с отделом ФБР. Они получили код для доступа к части файла. Введите его:",
              info:"Код состоит из названия отдела и года.", answer:"fbi-2026", hint:"FBI-2026", type:"text" },
            { title:"ЭТАП 3: БИОМЕТРИЧЕСКАЯ ЗАЩИТА",
              desc:"Система не пропускает дальше. Требуется подтверждение, что доступ запрашивает начальник отдела. Подтвердите личность — прикрепите видео, где начальник машет рукой.",
              info:"У вас на компьютере есть папка с фотографиями сотрудников. Подумайте, как получить видео из фото. Подойдёт любой файл-подтверждение.",
              answer:"file", hint:"Используйте инструмент, который «оживляет» фото.", type:"file", accept:"video/*" },
            { title:"ЭТАП 4: ПОИСК УЛИКИ",
              desc:"Система выдала координаты: «Ищите там, где растут цветы». Найдите в кабинете записку и введите код с неё:",
              info:"Посмотрите на окна.", answer:"цветок123", hint:"Проверьте цветочные горшки на подоконнике.", type:"text" },
            { title:"ЭТАП 5: ДВОИЧНЫЙ КОД",
              desc:"Переведите двоичный код в текст:<br><div class='terminal'>01001000 01100101 01101100 01110000</div>",
              info:"Воспользуйтесь онлайн-конвертером binary to text.", answer:"help", hint:"Help (латиницей).", type:"text" },
            { title:"ЭТАП 6: РАСШИФРОВКА ХЕША",
              desc:"Перед вами хеш пароля: <span class='terminal' style='display:inline-block;padding:6px 10px;'>5f4dcc3b5aa765d61d8327deb882cf99</span><br>Найдите в интернете, что это за пароль:",
              info:"Это самый популярный пароль в мире.", answer:"password", hint:"Password", type:"text" },
            { title:"ЭТАП 7: АНАЛИЗ ДОСЬЕ",
              desc:"Изучите досье (кнопка сверху). У кого из подозреваемых нет подтверждённого алиби? Введите имя:",
              info:"Совещание — не алиби, если никто не видел.", answer:"дана", hint:"Дана Сергеевна", type:"text" },
            { title:"ЭТАП 8: ЭКСПЕРТИЗА",
              desc:"Найдите в интернете, что такое «дактилоскопия», и введите ключевое слово (единственное число):",
              info:"Это наука об отпечатках пальцев.", answer:"отпечаток", hint:"Отпечаток", type:"text" },
            { title:"ЭТАП 9: QR-КОД",
              desc:"На столе шефа лежит QR-код. Отсканируйте его и введите секретное слово:",
              info:"Используйте телефон или онлайн-сканер.", answer:"секрет", hint:"Секрет", type:"text" },
            { title:"ЭТАП 10: ЛОГИКА",
              desc:"Если A > B, B > C, а C > D, то кто самый маленький?",
              info:"Простая математика.", answer:"d", hint:"D", type:"text" },
            { title:"ЭТАП 11: МАТЕМАТИКА",
              desc:"Сколько будет 15% от 200?",
              info:"15% — это 15/100.", answer:"30", hint:"Тридцать", type:"text" },
            { title:"ЭТАП 12: ШИФР АТБАШ",
              desc:"Расшифруйте слово (шифр Атбаш): <strong style='font-size:1.4rem;color:var(--accent);'>ЯТУМГ</strong>",
              info:"Атбаш — зеркальный алфавит (А=Я, Б=Ю).", answer:"агент", hint:"Агент", type:"text" },
            { title:"ЭТАП 13: ГЕОГРАФИЯ",
              desc:"В каком году был основан город Санкт-Петербург?",
              info:"Это было при Петре I.", answer:"1703", hint:"1703", type:"text" },
            { title:"ЭТАП 14: ИСТОРИЯ",
              desc:"В каком году человек впервые полетел в космос?",
              info:"Это сделал Юрий Гагарин.", answer:"1961", hint:"1961", type:"text" },
            { title:"ЭТАП 15: ВНИМАНИЕ",
              desc:"Сколько раз буква «О» встречается в слове «МОЛОКО»?",
              info:"Просто посчитайте.", answer:"3", hint:"Три", type:"text" },
            { title:"ЭТАП 16: ЛОГИКА",
              desc:"У отца 5 сыновей. У каждого есть сестра. Сколько всего детей?",
              info:"Сестра одна на всех.", answer:"6", hint:"Шесть", type:"text" },
            { title:"ЭТАП 17: ПОИСК УЛИК",
              desc:"Ищите под зелёным столом папку с надписью «СЕКРЕТНО». Введите код с папки:",
              info:"Код написан маркером.", answer:"папка777", hint:"Папка777", type:"text" },
            { title:"ЭТАП 18: АНАЛИЗ",
              desc:"Сравните отпечаток на флешке с базой данных. Чей это отпечаток? Введите имя:",
              info:"У кого нет алиби?", answer:"дана", hint:"Дана", type:"text" },
            { title:"ЭТАП 19: СБОРКА ПАЗЛА",
              desc:"<div class='big-puzzle'>ОДНА ЧАСТЬ ПАЗЛА ПОЛУЧЕНА.<br>ВЗЛОМ ОПРАВДАН.<br>ЭТО ПОНАДОБИТСЯ ПОЗЖЕ.</div><br>Ваш фрагмент двоичного кода:<div class='terminal' style='color:#fff;font-size:1.05rem;'>01010010 01100101 01100011 01100101 01110000 01110100 00111010 00100000 00110001 00100000 01110011 01110100 01100001 01101011 01100001 01101110 00100000 01110011 01100001 01101000 01100001 01110010 01100001</div>",
              info:"Сохраните этот код. Он понадобится в финале.", answer:"готово", hint:"Введите «готово», чтобы продолжить.", type:"text" },
            { title:"ЭТАП 20: ФИНАЛ",
              desc:"Вы собрали все улики. Кто преступник?",
              info:"Проверьте алиби ещё раз.", answer:"дана сергеевна", hint:"Дана Сергеевна", type:"text" }
        ];

        // ===== СОСТОЯНИЕ =====
        let state = { currentStage: 0, attempts: 0, notes: "" };
        if (localStorage.getItem('police_state_v2')) state = JSON.parse(localStorage.getItem('police_state_v2'));
        function saveState() { localStorage.setItem('police_state_v2', JSON.stringify(state)); }

        const container = document.getElementById('questContainer');

        function renderStage() {
            if (state.currentStage >= stages.length) {
                container.innerHTML = `<div class="final-block"><h2>🎉 ДЕЛО ЗАКРЫТО!</h2><p style="font-size:1.2rem;color:#fff;">Преступник — <strong>Дана Сергеевна</strong>. Мотив: приготовить карамель для детей. Заберите рецепт и Chupa Chups!</p></div>`;
                return;
            }
            const s = stages[state.currentStage];
            let inputHtml = '';
            if (s.type === 'file') {
                inputHtml = `<input type="file" id="fileInput" accept="${s.accept||''}"><button class="btn" onclick="checkAnswer()">ОТПРАВИТЬ</button>`;
            } else {
                inputHtml = `<input type="text" id="textInput" placeholder="Введите ответ"><button class="btn" onclick="checkAnswer()">ПРОВЕРИТЬ</button>`;
            }
            container.innerHTML = `
                <div class="progress-bar">ЭТАП ${state.currentStage + 1} ИЗ ${stages.length}</div>
                <div class="stage">
                    <h2>${s.title}</h2>
                    <p>${s.desc}</p>
                    <div class="info-block"><strong>Сведения от шефа:</strong> ${s.info}</div>
                    ${inputHtml}
                    <p class="msg" id="errorMsg"></p>
                    <p class="hint" id="hintMsg"></p>
                    <div id="passBlock" class="hidden" style="margin-top:20px;border-top:1px solid var(--border-color);padding-top:20px;">
                        <p style="color:#ffbb33;font-size:0.9rem;">Требуется пароль от шефа (родительский контроль):</p>
                        <input type="password" id="passInput" placeholder="Пароль шефа">
                        <button class="btn btn-warning" onclick="checkPass()">ВВЕСТИ ПАРОЛЬ</button>
                        <p class="msg" id="passMsg"></p>
                        <div id="answerBlock" class="hidden" style="margin-top:15px;">
                            <p style="color:#00ff00;font-weight:bold;">Правильный ответ: ${s.answer}</p>
                            <button class="btn" onclick="nextStage()">ПРОДОЛЖИТЬ</button>
                        </div>
                    </div>
                    <div style="margin-top:25px;border-top:1px solid var(--border-color);padding-top:15px;">
                        <strong style="color:var(--accent);font-size:0.95rem;">📝 Лист заметок</strong>
                        <textarea class="notes-area" id="notesArea" placeholder="Записывайте, про кого какая информация уже есть...">${state.notes||''}</textarea>
                        <button class="btn" style="padding:10px 20px;font-size:0.9rem;margin-top:8px;" onclick="saveNotes()">СОХРАНИТЬ ЗАМЕТКИ</button>
                    </div>
                </div>`;
            if (state.attempts >= 10) {
                document.getElementById('passBlock').classList.remove('hidden');
                document.getElementById('errorMsg').innerText = "Лимит попыток исчерпан.";
            } else if (state.attempts >= 6) {
                document.getElementById('hintMsg').innerText = "Подсказка: " + s.hint;
            }
        }

        function saveNotes() {
            const el = document.getElementById('notesArea');
            if (el) { state.notes = el.value; saveState(); }
        }

        function checkAnswer() {
            const s = stages[state.currentStage];
            let val = '';
            if (s.type === 'file') {
                const f = document.getElementById('fileInput');
                if (f.files.length > 0) val = 'file';
            } else {
                const el = document.getElementById('textInput');
                val = (el.value || '').trim().toLowerCase().replace(/\s+/g,' ');
            }
            if (val === s.answer.toLowerCase() || (s.answer === 'file' && val === 'file')) {
                saveNotes();
                nextStage();
            } else {
                state.attempts++; saveState();
                const errorMsg = document.getElementById('errorMsg');
                const hintMsg = document.getElementById('hintMsg');
                const passBlock = document.getElementById('passBlock');
                if (state.attempts >= 10) {
                    errorMsg.innerText = "Лимит попыток исчерпан.";
                    passBlock.classList.remove('hidden');
                } else if (state.attempts >= 6) {
                    errorMsg.innerText = "Неверно.";
                    hintMsg.innerText = "Подсказка: " + s.hint;
                } else {
                    errorMsg.innerText = "Неверно! Попробуйте ещё раз.";
                }
            }
        }

        function checkPass() {
            const pass = document.getElementById('passInput').value.trim();
            if (pass === '1357') {
                document.getElementById('passMsg').innerText = "";
                document.getElementById('answerBlock').classList.remove('hidden');
                document.getElementById('passBlock').classList.add('hidden');
            } else {
                document.getElementById('passMsg').innerText = "Доступ запрещён. Неверный пароль.";
            }
        }

        function nextStage() {
            state.currentStage++;
            state.attempts = 0;
            saveState();
            renderStage();
        }

        renderStage();
    </script>
</body>
</html>
